<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English practice pilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#FFFCF6;--surface:#F4EFE4;--ink:#1D1B18;--muted:#5A554D;--line:#E4DED2;
  --primary:#2C3E9E;--on-primary:#FFFFFF;--primary-soft:#E6E9F7;--primary-ink:#1F2D78;
  --reward:#C25E00;--on-reward:#FFFFFF;--reward-soft:#FFF0DC;--reward-ink:#8A3F00;
  --ok-soft:#E2F1E7;--ok-ink:#174F2F;--ok:#1E6B3F;
  --bad-soft:#FCE4D6;--bad-ink:#8A2F08;--bad:#A33A0B;
  --locked:#EFEAE0;--locked-ink:#6B655C;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1814;--surface:#26231D;--ink:#F3EFE7;--muted:#B5AEA2;--line:#3A362E;
  --primary:#8F9CF0;--on-primary:#10153A;--primary-soft:#262C52;--primary-ink:#C2C9FA;
  --reward:#F5A54A;--on-reward:#2A1700;--reward-soft:#3A2A15;--reward-ink:#F7C98E;
  --ok-soft:#183224;--ok-ink:#A9E4C1;--ok:#6CC793;
  --bad-soft:#3B2016;--bad-ink:#F6B596;--bad:#F08A5D;
  --locked:#24211B;--locked-ink:#9C958A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1A1814;--surface:#26231D;--ink:#F3EFE7;--muted:#B5AEA2;--line:#3A362E;
  --primary:#8F9CF0;--on-primary:#10153A;--primary-soft:#262C52;--primary-ink:#C2C9FA;
  --reward:#F5A54A;--on-reward:#2A1700;--reward-soft:#3A2A15;--reward-ink:#F7C98E;
  --ok-soft:#183224;--ok-ink:#A9E4C1;--ok:#6CC793;
  --bad-soft:#3B2016;--bad-ink:#F6B596;--bad:#F08A5D;
  --locked:#24211B;--locked-ink:#9C958A;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.35}
button,input{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
#app{max-width:480px;min-height:100%;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:flex;flex-direction:column;gap:18px;flex:1}
.col{display:flex;flex-direction:column;gap:16px}
.iconbtn{width:48px;height:48px;flex:none;border-radius:24px;border:none;background:var(--primary-soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--surface);color:var(--ink)}
.pill{display:flex;align-items:center;gap:6px;border-radius:24px;padding:6px 12px;font-weight:600;border:none;font-size:17px}
.who{background:var(--surface);color:var(--ink)}
.av{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.hi{display:block;font-size:16px;color:var(--muted);font-weight:400}
h1{margin:0;font-size:28px;line-height:1.2}
.btn{width:100%;min-height:68px;border:none;border-radius:18px;background:var(--primary);color:var(--on-primary);font-size:21px;font-weight:700;line-height:1.15;padding:10px 16px}
.btn .hi{color:inherit;opacity:.8}
.btn2{min-height:60px;border-radius:16px;border:2px solid var(--primary);background:transparent;color:var(--primary-ink);font-size:18px;font-weight:700;line-height:1.15;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:left}
.btn2 .hi{font-size:15px;color:inherit;opacity:.85}
.ghost{border:none;background:none;color:var(--muted);font-size:17px;font-weight:600;min-height:48px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.goal{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.goal .hi{color:inherit;opacity:.8}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg{height:12px;border-radius:6px;background:color-mix(in srgb,var(--on-primary) 25%,transparent)}
.seg.on{background:var(--reward)}
.goal .btn{background:var(--on-primary);color:var(--primary)}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;border:none;color:var(--ink);text-align:left;width:100%;font-size:17px}
.row.locked{background:var(--locked);color:var(--locked-ink)}
.stars{display:inline-flex;color:var(--reward);margin-left:auto}
.stars .off{color:var(--line)}
.en{font-size:30px;font-weight:700;line-height:1.15}
.progress{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;min-width:120px}
.progress div{height:10px;border-radius:5px;background:var(--line)}
.progress .on{background:var(--primary)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 4px}
.mic{width:112px;height:112px;border-radius:56px;border:none;background:var(--reward);color:var(--on-reward);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px var(--reward-soft)}
.mic.live{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px var(--reward-soft)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none;box-shadow:0 0 0 16px var(--reward-soft)}}
.center{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:6px 12px;font-size:22px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.wrong{background:var(--bad-soft);color:var(--bad-ink);border:2px solid var(--bad)}
.chip.missing{background:transparent;color:var(--bad-ink);border:2px dashed var(--bad)}
.tip{background:var(--reward-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tip b{color:var(--reward-ink)}
.msg{border-radius:16px;padding:12px 14px;background:var(--surface);font-size:17px}
.msg.bad{background:var(--bad-soft);color:var(--bad-ink)}
.msg.ok{background:var(--ok-soft);color:var(--ok-ink)}
.heard{font-size:15px;color:var(--muted)}
.dots{display:flex;gap:8px}
.dot{width:30px;height:30px;border-radius:15px;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.dot.done{background:var(--ok);color:var(--bg)}
.dot.now{background:var(--primary);color:var(--on-primary)}
.steps{display:none;flex-direction:column;gap:10px;background:var(--surface);border-radius:20px;padding:16px}
.step{display:flex;align-items:center;gap:12px;font-size:17px;line-height:1.2}
.step.now{font-weight:700}
.step.later{color:var(--muted)}
.word{background:var(--surface);border-radius:24px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.word .big{font-size:56px;font-weight:700;line-height:1}
.syl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.syl span{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-size:28px;font-weight:600}
.stat{border-radius:18px;padding:16px;text-align:center}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stu{border:none;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:19px;font-weight:600}
.stu .av{width:72px;height:72px;border-radius:36px;font-size:30px}
.field{display:flex;gap:10px;flex-wrap:wrap}
.field input{flex:1;min-width:180px;min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;padding:0 16px}
.field input:focus{border-color:var(--primary);outline:none}
.field .btn{width:auto;min-height:60px;padding:0 22px;font-size:18px}
.tablewrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface);font-weight:600}
.kbd-hints{display:none;gap:16px;justify-content:center;color:var(--muted);font-size:15px;flex-wrap:wrap}
kbd{font-family:inherit;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 7px;font-weight:600;color:var(--ink)}
.foot{font-size:14px;color:var(--muted);text-align:center;margin-top:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:900px){
  #app{max-width:1080px;padding:28px 40px;gap:24px}
  .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start;flex:none}
  .en{font-size:46px}
  .hi.big-hi{font-size:24px}
  .mic{width:136px;height:136px;border-radius:68px}
  .panel{background:var(--surface);border-radius:28px;padding:28px}
  .panel .msg{background:var(--bg)}
  .steps{display:flex}
  .kbd-hints{display:flex}
  .chip{font-size:26px}
  .word .big{font-size:72px}
  .narrow{max-width:620px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
// ---------- Content (seed; Hindi lines and hints pending teacher review) ----------
const LESSON = {
  title_en: "Bus stand", title_hi: "बस स्टैंड",
  sentences: [
    { id: "bus_01", text: "Where is the bus stop?", hi: "बस स्टॉप कहाँ है?", chunks: ["Where is", "the bus stop"] },
    { id: "bus_02", text: "When will the bus come?", hi: "बस कब आएगी?", chunks: ["When will", "the bus come"] },
    { id: "bus_03", text: "One ticket to Patna, please.", hi: "पटना का एक टिकट दीजिए।", chunks: ["One ticket", "to Patna", "please"] },
    { id: "bus_04", text: "How much is the ticket?", hi: "टिकट कितने का है?", chunks: ["How much", "is the ticket"] },
    { id: "bus_05", text: "Does this bus go to Bettiah?", hi: "क्या यह बस बेतिया जाती है?", chunks: ["Does this bus", "go to Bettiah"] }
  ]
};
const WORDS = {
  where: { syl: ["where"], hi: "वेयर", tag: "v_w" },
  when: { syl: ["when"], hi: "वेन", tag: "v_w" },
  will: { syl: ["will"], hi: "विल", tag: "v_w" },
  bus: { syl: ["bus"], hi: "बस", tag: "short_vowel" },
  stop: { syl: ["stop"], hi: "स्टॉप", tag: "s_cluster" },
  come: { syl: ["come"], hi: "कम", tag: "short_vowel" },
  much: { syl: ["much"], hi: "मच", tag: "short_vowel" },
  ticket: { syl: ["tic", "ket"], hi: "टि-केट", tag: "generic" },
  please: { syl: ["please"], hi: "प्लीज़", tag: "generic" },
  does: { syl: ["does"], hi: "डज़", tag: "generic" },
  this: { syl: ["this"], hi: "दिस", tag: "th" },
  the: { syl: ["the"], hi: "द", tag: "th" },
  patna: { syl: ["Pat", "na"], hi: "पट-ना", tag: "generic", accept: ["patna", "patana", "pattna", "patnaa"] },
  bettiah: { syl: ["Bet", "ti", "ah"], hi: "बे-ति-या", tag: "generic", accept: ["bettiah", "betia", "bettia", "betiya", "bettiya", "bethia"] }
};
const HINTS = {
  v_w: "“w” बोलते समय होंठ गोल कीजिए, दाँत होंठ पर न लगाइए।",
  th: "“th” में जीभ हल्की-सी दाँतों के बीच रखिए।",
  s_cluster: "“स्ट” सीधे बोलिए, आगे “इ” मत जोड़िए (“इस्टॉप” नहीं)।",
  short_vowel: "इस शब्द को छोटा और जल्दी बोलिए।",
  generic: "फिर से सुनिए और धीरे-धीरे बोलिए।"
};
const CONFIG = { goal: 5, xpAttempt: 10, xpStar: 5, xpFixStep: 5, twoStarRatio: 0.6, slowRate: 0.6, normalRate: 0.9, leitnerDays: [1, 3, 7] };
const AV = [["var(--reward-soft)", "var(--reward-ink)"], ["var(--ok-soft)", "var(--ok-ink)"], ["var(--primary-soft)", "var(--primary-ink)"], ["var(--bad-soft)", "var(--bad-ink)"]];

// ---------- Icons ----------
const I = {
  speaker: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mic: '<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
  stop: '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  star: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
  flame: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3 0-3-1-5 0-8z"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  retry: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></svg>',
  dash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>',
  close: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>',
  play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>',
  lock: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  chart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};
const stars = (n, size) => '<span class="stars" role="img" aria-label="' + n + ' of 3 stars">' +
  [1, 2, 3].map(i => '<span class="' + (i <= n ? '' : 'off') + '">' + (size ? I.star.replace(/22/g, size) : I.star) + '</span>').join('') + '</span>';

// ---------- Storage: one browser, many students ----------
const KEY = "eb-pilot-v2";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} }
const D = Object.assign({ students: {}, order: [], current: null, log: [] }, load());
const newStudent = name => ({ name, xpTotal: 0, xpByDay: {}, doneByDay: {}, streak: 0, lastDay: null, best: {}, revise: {} });
const St = () => D.students[D.current];
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 86400000);
const doneToday = () => St().doneByDay[today()] || [];
const xpToday = () => St().xpByDay[today()] || 0;
function addXP(n) { const s = St(); s.xpTotal += n; s.xpByDay[today()] = xpToday() + n; save(); }
function markDone(id, starsN) {
  const s = St(), t = today(), list = doneToday();
  if (!list.includes(id)) list.push(id);
  s.doneByDay[t] = list;
  s.best[id] = Math.max(s.best[id] || 0, starsN);
  if (s.lastDay !== t) { s.streak = !s.lastDay ? 1 : dayDiff(s.lastDay, t) <= 3 ? s.streak + 1 : 1; s.lastDay = t; }
  save();
}
function updateRevision(results) {
  const s = St(), t = today();
  results.forEach(r => {
    const w = r.word;
    if (r.status !== "ok") s.revise[w] = { box: 1, due: addDays(CONFIG.leitnerDays[0]) };
    else if (s.revise[w] && s.revise[w].due <= t) {
      const box = s.revise[w].box + 1;
      if (box > CONFIG.leitnerDays.length) delete s.revise[w];
      else s.revise[w] = { box, due: addDays(CONFIG.leitnerDays[box - 1]) };
    }
  });
  save();
}
function logAttempt(mode, target, heard, sc) {
  D.log.push({ time: new Date().toISOString(), student: St().name, sentence: sent().id, mode, target, heard, correct: sc.c, total: sc.n, stars: sc.stars || "" });
  save();
}

// ---------- Text matching ----------
const NUM = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
function normTok(t) { t = t.toLowerCase().replace(/[^a-z0-9']/g, ""); return /^\d+$/.test(t) && +t <= 10 ? NUM[+t] : t; }
function normText(s) { return s.toLowerCase().replace(/-/g, " ").split(/\s+/).map(normTok).filter(Boolean); }
function same(t, h) { return t === h || ((WORDS[t] && WORDS[t].accept) || []).includes(h); }
function align(T, H) {
  const n = T.length, m = H.length, d = [];
  for (let i = 0; i <= n; i++) { d.push(new Array(m + 1).fill(0)); d[i][0] = i; }
  for (let j = 0; j <= m; j++) d[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    d[i][j] = Math.min(d[i - 1][j - 1] + (same(T[i - 1], H[j - 1]) ? 0 : 1), d[i - 1][j] + 1, d[i][j - 1] + 1);
  const res = T.map(w => ({ word: w, status: "missing" })), extra = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (same(T[i - 1], H[j - 1]) ? 0 : 1)) { res[i - 1].status = same(T[i - 1], H[j - 1]) ? "ok" : "wrong"; i--; j--; }
    else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { res[i - 1].status = "missing"; i--; }
    else { extra.unshift(H[j - 1]); j--; }
  }
  return { res, extra };
}
function score(res) { const c = res.filter(r => r.status === "ok").length, n = res.length; return { c, n, stars: c === n ? 3 : c / n >= CONFIG.twoStarRatio ? 2 : 1 }; }

// ---------- Speech ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen() {
  return new Promise(resolve => {
    if (!SR) return resolve({ error: "unsupported" });
    let finished = false, text = "";
    rec = new SR(); rec.lang = "en-IN"; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
    rec.onresult = e => { text = e.results[0][0].transcript; };
    rec.onerror = e => { if (!finished) { finished = true; resolve({ error: e.error }); } };
    rec.onend = () => { if (!finished) { finished = true; resolve(text ? { text } : { error: "no-speech" }); } };
    try { rec.start(); } catch (e) { finished = true; resolve({ error: "start-failed" }); }
  });
}

  if (DL) {
    try { await DL.save({ filename: name, data: csv }); S.msg = { kind: "ok", html: "Results saved.<span class='hi'>नतीजे सेव हो गए।</span>" }; }
    catch (e) { S.msg = e && e.code === "declined" ? null : { kind: "bad", html: "The file couldn’t be saved here. Select the table and copy it instead.<span class='hi'>फ़ाइल सेव नहीं हुई।</span>" }; }
    render(); return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

// ---------- Flow ----------
const celebrated = {};
function go(screen) { S.screen = screen; S.msg = null; render(); window.scrollTo(0, 0); }
function nextIndex() {
  const d = doneToday();
  for (let k = 1; k <= LESSON.sentences.length; k++) { const i = (S.idx + k) % LESSON.sentences.length; if (!d.includes(LESSON.sentences[i].id)) return i; }
  return (S.idx + 1) % LESSON.sentences.length;
}
function afterSentence() {
  if (doneToday().length >= CONFIG.goal && celebrated[D.current] !== today()) { celebrated[D.current] = today(); go("done"); return; }
  S.idx = nextIndex(); go("practice");
}
function addStudent() {
  const inp = document.getElementById("newname"), name = (inp && inp.value || "").trim();
  if (!name) { S.msg = { kind: "bad", html: "Type the student’s name first.<span class='hi'>पहले नाम लिखिए।</span>" }; render(); const i = document.getElementById("newname"); if (i) i.focus(); return; }
  const id = "s" + Date.now().toString(36);
  D.students[id] = newStudent(name); D.order.push(id); D.current = id; save();
  S.idx = 0; go("home");
}
async function onMic() {
  if (S.listening) { try { rec && rec.stop(); } catch (e) {} return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  S.listening = true; S.msg = null; render();
  const out = await listen();
  S.listening = false;
  if (out.error) { S.msg = errMsg(out.error); render(); return; }
  if (S.screen === "practice") handleAttempt(out.text);
  else if (S.screen === "fix") handleFix(out.text);
}
function handleAttempt(heard) {
  const s = sent(), a = align(tokens(s).map(normTok), normText(heard)), sc = score(a.res), xp = CONFIG.xpAttempt + CONFIG.xpStar * sc.stars;
  addXP(xp); markDone(s.id, sc.stars); updateRevision(a.res); logAttempt("sentence", s.text, heard, sc);
  S.result = Object.assign({ res: a.res, extra: a.extra, heard, xp }, sc);
  go("feedback");
}
function startFix() {
  const w = firstWrong(), s = sent();
  S.fix = { word: w, chunk: s.chunks.find(c => normText(c).includes(w)) || s.text, step: 1, fails: 0 };
  go("fix");
}
function handleFix(heard) {
  const f = S.fix, target = fixTarget(), a = align(normText(target), normText(heard)), sc = score(a.res), ok = sc.c === sc.n;
  logAttempt("fix step " + f.step, target, heard, { c: sc.c, n: sc.n });
  if (ok) {
    addXP(CONFIG.xpFixStep);
    if (f.step === 5) { updateRevision(a.res); afterSentence(); return; }
    f.step++; f.fails = 0;
    S.msg = { kind: "ok", html: "Correct! +" + CONFIG.xpFixStep + " XP<span class='hi'>सही! अगला कदम</span>" };
  } else {
    f.fails++;
    if (f.fails >= 2) { f.step = Math.max(1, f.step - 1); f.fails = 0; S.msg = { kind: "bad", html: "Let’s go back one step.<span class='hi'>एक कदम पीछे चलते हैं।</span>" }; }
    else S.msg = { kind: "bad", html: "Try once more. We heard: “" + esc(heard) + "”<span class='hi'>एक बार और कोशिश कीजिए।</span>" };
  }
  render();
}
function listenNow(slow) {
  const rate = slow ? CONFIG.slowRate : CONFIG.normalRate;
  if (S.screen === "practice" || S.screen === "feedback") speak(sent().text, "en-IN", rate);
  else if (S.screen === "fix") speak(S.fix.step <= 3 ? S.fix.word : fixTarget(), "en-IN", S.fix.step <= 3 ? CONFIG.slowRate : rate);
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  switch (b.dataset.act) {
    case "help": speak(helpText(), "hi-IN", 0.95); break;
    case "students": go("students"); setTimeout(() => { const i = document.getElementById("newname"); if (i && !D.order.length) i.focus(); }, 0); break;
    case "pick": D.current = b.dataset.id; save(); S.idx = 0; go("home"); break;
    case "add": addStudent(); break;
    case "results": go("results"); break;
    case "csv": exportCSV(); break;
    case "start": case "more": S.idx = doneToday().length ? nextIndex() : 0; go("practice"); break;
    case "open": S.idx = +b.dataset.i; go("practice"); break;
    case "home": go("home"); break;
    case "say": speak(sent().text, "en-IN", b.dataset.rate === "s" ? CONFIG.slowRate : CONFIG.normalRate); break;
    case "sayword": speak(S.fix.word, "en-IN", CONFIG.slowRate); break;
    case "saytarget": speak(fixTarget(), "en-IN", CONFIG.normalRate); break;
    case "mic": onMic(); break;
    case "fix": startFix(); break;
    case "fixnext": S.fix.step++; S.msg = null; render(); break;
    case "back": go("feedback"); break;
    case "next": afterSentence(); break;
  }
});
app.addEventListener("keydown", e => { if (e.target.id === "newname" && e.key === "Enter") { e.preventDefault(); addStudent(); } });
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea") || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const k = e.key.toLowerCase(), canSpeak = S.screen === "practice" || (S.screen === "fix" && S.fix.step >= 3);
  if (k === " " && canSpeak) { e.preventDefault(); onMic(); }
  else if (k === "l" && ["practice", "feedback", "fix"].includes(S.screen)) listenNow(false);
  else if (k === "s" && ["practice", "fix"].includes(S.screen)) listenNow(true);
  else if (k === "enter" && (document.activeElement === document.body || !document.activeElement)) { const p = app.querySelector("[data-primary]"); if (p) { e.preventDefault(); p.click(); } }
});
render();
</script>
